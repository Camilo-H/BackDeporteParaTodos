#definicion de puerto de conexion
server.port= 8082
spring.application.name= deporteParaTodos

#Conexion a base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/deporteParaTodos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#JPA settings
spring.jpa.hibernate.ddl-auto= none

#mostrar sql formato
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#manejo de datos grandes - para envio y recepcion de multimedia, en este caso imagenes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#habilitar el manejo de archivos multipart
spring.servlet.multipart.enabled=true

#configuracion de log
logging.level.root=INFO
logging.level.co.edu.unicauca.deporteParaTodos=INFO

# --- Spring Security / OAuth2 ---
# JWKS de Google para validar tokens ID entrantes (rotacion de claves automatica)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
# Secreto HMAC-SHA256 para firmar los JWT propios del sistema.
# Definir como variable de entorno: export JWT_SECRET=$(openssl rand -base64 32)
# Nunca commitear el valor real -- mismo patron que SONAR_TOKEN en CI.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000